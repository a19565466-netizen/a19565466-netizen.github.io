<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد</title>
<style>
  :root{--bg:#0e1414;--panel:#161d1d;--text:#e9efee;--muted:#93a3a1;--accent:#5ee6c5;--line:#2a3333;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:Tahoma,sans-serif;gap:14px;}
  h1{font-size:1.3rem;margin:0;}
  p{color:var(--muted);margin:0;}
  button{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:.88rem;}
</style>
</head>
<body>
  <h1>خوش اومدی 👋</h1>
  <p id="whoami">در حال بررسی...</p>
  <button id="logoutBtn">خروج</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if(!user){
        location.href = "index.html";
        return;
      }
      document.getElementById("whoami").textContent = "وارد شدی با: " + (user.displayName || "کاربر");
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.href = "index.html";
    });
  </script>
</body>
</html>
